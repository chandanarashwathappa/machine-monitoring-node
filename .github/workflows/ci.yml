name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build (gcc, -Wall -Wextra)
        run: make all

      - name: C unit tests
        run: make unit

      - name: Software-in-the-Loop tests (Modbus TCP + OPC UA, pytest)
        run: make sil PYTHON=python
